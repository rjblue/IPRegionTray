name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.1.0"
        required: true
        default: "v1.1.0"
      version:
        description: "Package version, for example 1.1.0"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            version="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          notes="RELEASE_NOTES_v$version.md"
          if [[ ! -f "$notes" ]]; then
            notes="RELEASE_NOTES_v1.0.0.md"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Build release package
        run: ./scripts/package-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify package
        shell: bash
        run: |
          package="release/IPRegionTray-${{ steps.version.outputs.version }}-mac-arm64.zip"
          test -f "$package"
          unzip -q "$package" -d /tmp/ipregiontray-release-check
          app="/tmp/ipregiontray-release-check/IPRegionTray-${{ steps.version.outputs.version }}/app/IPRegionTray.app"
          executable="$app/Contents/MacOS/IPRegionTray"
          file "$executable"
          lipo -archs "$executable" | grep -qx arm64
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: IPRegionTray ${{ steps.version.outputs.version }}
          body_path: ${{ steps.version.outputs.notes }}
          files: release/IPRegionTray-${{ steps.version.outputs.version }}-mac-arm64.zip
          fail_on_unmatched_files: true
